name: Build and Publish Tools

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Pack Tool Packages
      run: dotnet pack --configuration Release --no-build --output ./packages
    
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: packages/

  publish-tools:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./packages
    
    - name: Configure custom NuGet feed
      run: |
        dotnet nuget add source \
          --name CustomFeed \
          --username ${{ secrets.NUGET_FEED_USERNAME }} \
          --password ${{ secrets.NUGET_FEED_PASSWORD }} \
          --store-password-in-clear-text \
          ${{ secrets.NUGET_FEED_URL }}
    
    - name: Publish to custom feed
      run: |
        dotnet nuget push "./packages/*.nupkg" \
          --api-key ${{ secrets.NUGET_FEED_API_KEY }} \
          --source CustomFeed \
          --skip-duplicate || true
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Would push to container registry here"
